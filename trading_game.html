<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crypto Trading Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e17;--bg2:#0f1520;--bg3:#141c2a;
  --card:#111824;--border:#1e2d3d;--border2:#1a2535;
  --accent:#3b82f6;--accent2:#60a5fa;
  --green:#22c55e;--green2:#4ade80;--green-bg:#0d2d1a;--green-border:#1a4a2c;
  --red:#ef4444;--red2:#f87171;--red-bg:#2d0d0d;--red-border:#4a1a1a;
  --text:#e2e8f0;--sub:#64748b;--sub2:#475569;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;padding:12px;min-height:100vh}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.hdr-left h1{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#fff;letter-spacing:-0.5px}
.hdr-left p{font-size:10px;color:var(--sub);margin-top:2px}
.hdr-right{text-align:right}
.bal-lbl{font-size:10px;color:var(--sub)}
.bal{font-size:20px;font-weight:700;color:var(--accent2);font-family:'Syne',sans-serif}
.pnl{font-size:11px;margin-top:2px;font-weight:500}

/* TICKER */
.ticker{display:flex;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tick{font-size:11px;color:var(--sub);white-space:nowrap}
.tick b{margin-left:4px}

/* COINS GRID */
.coins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.coin{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color 0.15s,background 0.15s;position:relative;overflow:hidden}
.coin::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.15s;background:rgba(59,130,246,0.05)}
.coin:active::before{opacity:1}
.coin.sel{border-color:var(--accent);background:#0d1e33}
.coin-id{font-size:13px;font-weight:700;color:#fff}
.coin-name{font-size:10px;color:var(--sub);margin-bottom:6px}
.coin-price{font-size:15px;font-weight:700;color:#fff;margin-bottom:3px}
.coin-chg{font-size:11px;font-weight:500}
.coin-hold{font-size:10px;color:var(--sub);margin-top:4px;padding-top:4px;border-top:1px solid var(--border)}

/* CHART */
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.chart-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chart-title{font-size:12px;font-weight:700;color:#fff}
.chart-ohlc{font-size:10px;color:var(--sub)}
.chart-svg{width:100%;height:100px;display:block}

/* TRADE */
.trade-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.trade-hdr{font-size:11px;color:var(--sub);margin-bottom:10px}
.inp-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.inp-lbl{font-size:12px;color:var(--sub);white-space:nowrap}
.inp{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color 0.15s}
.inp:focus{border-color:var(--accent)}
.qrow{display:flex;gap:6px;margin-bottom:10px}
.qb{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 4px;color:var(--sub);font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all 0.15s}
.qb:active{background:var(--border);color:#fff}
.trade-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-buy{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green2);border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all 0.15s}
.btn-buy:active{background:var(--green-border);color:#fff}
.btn-sell{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red2);border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all 0.15s}
.btn-sell:active{background:var(--red-border);color:#fff}

/* PORTFOLIO */
.port-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.section-lbl{font-size:11px;color:var(--sub);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border2);font-size:12px}
.prow:last-child{border-bottom:none}
.prow-name{color:#fff;font-weight:700}
.prow-sub{font-size:10px;color:var(--sub);margin-top:2px}

/* LOG */
.log-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.litem{font-size:11px;padding:5px 0;border-bottom:1px solid var(--border2);color:var(--sub)}
.litem:last-child{border-bottom:none}
.litem .coin-tag{color:#fff;font-weight:700}
.litem .buy-tag{color:var(--green2)}
.litem .sell-tag{color:var(--red2)}

/* TOAST */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none;width:90%;max-width:380px}
.toast{border-radius:10px;padding:10px 16px;font-size:13px;font-weight:500;text-align:center;opacity:0;transform:translateY(-10px);transition:all 0.25s;display:none}
.toast.show{opacity:1;transform:translateY(0);display:block}

/* LEADERBOARD */
.lb-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.lb-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border2);font-size:12px}
.lb-row:last-child{border-bottom:none}
.lb-rank{color:var(--sub);width:20px;font-size:11px}
.lb-name{flex:1;color:#fff;font-weight:500}
.lb-val{font-weight:700}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.mode-tab{padding:8px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--sub);font-family:'JetBrains Mono',monospace;transition:all 0.15s}
.mode-tab.long-active{background:var(--green-bg);border-color:var(--green-border);color:var(--green2)}
.mode-tab.short-active{background:var(--red-bg);border-color:var(--red-border);color:var(--red2)}
.short-pos{background:var(--red-bg);border:1px solid var(--red-border);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:none}
.short-pos-title{font-size:11px;color:var(--red2);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.short-pos-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.btn-close-short{width:100%;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red2);border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;margin-top:8px;transition:all 0.15s}
.btn-close-short:active{background:var(--red-border);color:#fff}
</style>
</head>
<body>
<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<div class="app">
  <div class="hdr">
    <div class="hdr-left">
      <h1>Crypto Trading</h1>
      <p>Virtual exchange · start $10,000</p>
    </div>
    <div class="hdr-right">
      <div class="bal-lbl">Balance</div>
      <div class="bal" id="bal">$10,000</div>
      <div class="pnl" id="pnl" style="color:var(--green2)">+$0.00 (0.00%)</div>
    </div>
  </div>

  <div class="ticker" id="ticker"></div>

  <div class="coins" id="coins"></div>

  <div class="chart-box">
    <div class="chart-hdr">
      <span class="chart-title" id="ctitle">BTC/USD</span>
      <span class="chart-ohlc" id="ohlc">O:— H:— L:— C:—</span>
    </div>
    <svg class="chart-svg" id="chartSvg" viewBox="0 0 400 100" preserveAspectRatio="none"></svg>
  </div>

  <div class="trade-box">
    <div class="trade-hdr" id="trade-hdr">Trading · BTC</div>
    <div class="mode-tabs">
      <button class="mode-tab long-active" id="tab-long" onclick="setMode('long')">▲ LONG</button>
      <button class="mode-tab" id="tab-short" onclick="setMode('short')">▼ SHORT</button>
    </div>
    <div class="inp-row">
      <span class="inp-lbl">Amount $</span>
      <input class="inp" id="amt" type="number" value="100" min="1" inputmode="numeric">
    </div>
    <div class="qrow">
      <button class="qb" onclick="sa(100)">$100</button>
      <button class="qb" onclick="sa(500)">$500</button>
      <button class="qb" onclick="sa(1000)">$1K</button>
      <button class="qb" onclick="sa(2500)">$2.5K</button>
      <button class="qb" onclick="sa(-1)">All</button>
    </div>
    <div class="trade-btns" id="trade-btns">
      <button class="btn-buy" onclick="trade('buy')">▲ BUY</button>
      <button class="btn-sell" onclick="trade('sell')">▼ SELL</button>
    </div>
  </div>

  <div class="short-pos" id="short-pos">
    <div class="short-pos-title">Open shorts</div>
    <div id="short-list"></div>
  </div>

  <div class="port-box">
    <div class="section-lbl">Portfolio</div>
    <div id="port"></div>
  </div>

  <div class="lb-box">
    <div class="section-lbl">Leaderboard</div>
    <div id="lb"></div>
  </div>

  <div class="log-box">
    <div class="section-lbl">Trade history</div>
    <div id="log"><div class="litem" style="color:var(--sub2)">No trades — start trading!</div></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }

const COINS=[
  {id:'BTC',sym:'BTCUSDT',name:'Bitcoin',p:0,candles:[],cur:{o:0,h:0,l:0,c:0,t:0},open24:0},
  {id:'ETH',sym:'ETHUSDT',name:'Ethereum',p:0,candles:[],cur:{o:0,h:0,l:0,c:0,t:0},open24:0},
  {id:'SOL',sym:'SOLUSDT',name:'Solana',p:0,candles:[],cur:{o:0,h:0,l:0,c:0,t:0},open24:0},
  {id:'ADA',sym:'ADAUSDT',name:'Cardano',p:0,candles:[],cur:{o:0,h:0,l:0,c:0,t:0},open24:0},
];

let cash=10000,sel=0,hold={},logs=[],loaded=false,tradeMode='long';
const CANDLE_TICKS=30;
let shorts={}; // {BTC: {size, entryPrice, collateral}}

const LEADERS=[
  {name:'CryptoWolf',val:24831},
  {name:'TradeMaster',val:18420},
  {name:'BitKing',val:15670},
  {name:'SolQueen',val:13210},
  {name:'ETHhunter',val:11890},
];

COINS.forEach(c=>{ hold[c.id]=0; shorts[c.id]=null; });

const fp=n=>n<1?n.toFixed(4):n>1000?n.toFixed(0):n>100?n.toFixed(1):n.toFixed(2);
const fd=(n,d=2)=>(n<0?'-':'')+'$'+Math.abs(n).toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function tv(){
  let v=cash;
  COINS.forEach(c=>{
    v+=hold[c.id]*c.p;
    if(shorts[c.id]&&c.p){const s=shorts[c.id];v+=s.collateral+(s.entryPrice-c.p)*s.size;}
  });
  return v;
}

async function fetchPrices(){
  try{
    const syms=COINS.map(c=>`"${c.sym}"`).join(',');
    const res=await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=[${syms}]`);
    const data=await res.json();
    data.forEach(d=>{
      const coin=COINS.find(c=>c.sym===d.symbol);
      if(!coin) return;
      const newP=parseFloat(d.lastPrice);
      coin.open24=parseFloat(d.openPrice);
      if(!loaded||coin.p===0){
        coin.p=newP;
        coin.cur={o:newP,h:newP,l:newP,c:newP,t:0};
      } else {
        coin.p=newP;
        coin.cur.h=Math.max(coin.cur.h,newP);
        coin.cur.l=Math.min(coin.cur.l===0?newP:coin.cur.l,newP);
        coin.cur.c=newP;coin.cur.t++;
        if(coin.cur.t>=CANDLE_TICKS){
          coin.candles.push({...coin.cur});
          if(coin.candles.length>60)coin.candles.shift();
          coin.cur={o:newP,h:newP,l:newP,c:newP,t:0};
        }
      }
    });
    if(!loaded){await fetchKlines();loaded=true;}
    rAll();
  }catch(e){console.log('fetch err',e);}
}

async function fetchKlines(){
  for(const coin of COINS){
    try{
      const res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.sym}&interval=1m&limit=40`);
      const data=await res.json();
      coin.candles=data.slice(0,-1).map(k=>({o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4]),t:0}));
    }catch(e){console.log('klines err',e);}
  }
}

function drawChart(){
  const svg=document.getElementById('chartSvg');
  const coin=COINS[sel];
  if(!coin.p)return;
  const candles=[...coin.candles.slice(-28),{...coin.cur,c:coin.p}];
  if(candles.length<2)return;
  const allH=candles.map(c=>c.h),allL=candles.map(c=>c.l);
  const mx=Math.max(...allH),mn=Math.min(...allL),rng=mx-mn||1;
  const W=400,H=100,pad=4,n=candles.length;
  const cw=Math.floor((W-pad*2)/n),gw=Math.max(2,cw-2);
  let html='';
  candles.forEach((c,i)=>{
    const x=pad+i*cw,bull=c.c>=c.o,col=bull?'#22c55e':'#ef4444';
    const yH=(pad+(1-(c.h-mn)/rng)*(H-pad*2)).toFixed(1);
    const yL=(pad+(1-(c.l-mn)/rng)*(H-pad*2)).toFixed(1);
    const yO=(pad+(1-(c.o-mn)/rng)*(H-pad*2)).toFixed(1);
    const yC=(pad+(1-(c.c-mn)/rng)*(H-pad*2)).toFixed(1);
    const bT=Math.min(+yO,+yC).toFixed(1),bH=Math.max(1,Math.abs(+yO-+yC)).toFixed(1);
    const cx=(x+gw/2).toFixed(1);
    html+=`<line x1="${cx}" y1="${yH}" x2="${cx}" y2="${yL}" stroke="${col}" stroke-width="1"/>`;
    html+=`<rect x="${x}" y="${bT}" width="${gw}" height="${bH}" fill="${col}"/>`;
  });
  svg.innerHTML=html;
  const last=candles[candles.length-1];
  document.getElementById('ohlc').textContent=`O:${fp(last.o)} H:${fp(last.h)} L:${fp(last.l)} C:${fp(coin.p)}`;
  document.getElementById('ctitle').textContent=`${coin.id}/USD · 1m · ${fp(coin.p)}`;
}

function rCoins(){
  document.getElementById('coins').innerHTML=COINS.map((c,i)=>{
    const chg=c.open24>0?(c.p-c.open24)/c.open24*100:0;
    const col=chg>=0?'var(--green2)':'var(--red2)';
    const owned=hold[c.id];
    return `<div class="coin${i===sel?' sel':''}" onclick="selC(${i})">
      <div class="coin-id">${c.id}</div>
      <div class="coin-name">${c.name}</div>
      <div class="coin-price">${c.p?fp(c.p):'...'}</div>
      <div class="coin-chg" style="color:${col}">${chg>=0?'+':''}${chg.toFixed(2)}% 24h</div>
      ${owned>0.000001?`<div class="coin-hold">${owned.toFixed(owned>1?2:5)} coins</div>`:''}
    </div>`;
  }).join('');
}

function rPort(){
  let html='';
  COINS.forEach(c=>{
    if(hold[c.id]>0.000001){
      html+=`<div class="prow"><div><div class="prow-name">${c.id}</div><div class="prow-sub">${hold[c.id].toFixed(hold[c.id]>1?3:5)} coins</div></div><div style="text-align:right"><div style="color:#fff;font-weight:700">${fd(hold[c.id]*c.p)}</div></div></div>`;
    }
  });
  html+=`<div class="prow"><div class="prow-name">USD</div><div style="color:var(--accent2);font-weight:700">${fd(cash)}</div></div>`;
  document.getElementById('port').innerHTML=html;
}

function rBal(){
  const t=tv(),pnl=t-10000,pct=pnl/100;
  document.getElementById('bal').textContent=fd(t,0).replace('.00','');
  const pe=document.getElementById('pnl');
  pe.textContent=`${pnl>=0?'+':''}${fd(pnl)} (${pnl>=0?'+':''}${pct.toFixed(2)}%)`;
  pe.style.color=pnl>=0?'var(--green2)':'var(--red2)';
}

function rTicker(){
  document.getElementById('ticker').innerHTML=COINS.map(c=>{
    const chg=c.open24>0?(c.p-c.open24)/c.open24*100:0;
    const col=chg>=0?'var(--green2)':'var(--red2)';
    return `<div class="tick">${c.id}<b style="color:${col}">${c.p?fp(c.p):'...'} ${chg>=0?'▲':'▼'}${Math.abs(chg).toFixed(2)}%</b></div>`;
  }).join('');
}

function rLeaders(){
  const myVal=Math.round(tv());
  let all=[...LEADERS,{name:tg?.initDataUnsafe?.user?.first_name||'You',val:myVal,me:true}];
  all.sort((a,b)=>b.val-a.val);
  const medals=['🥇','🥈','🥉'];
  document.getElementById('lb').innerHTML=all.slice(0,6).map((p,i)=>{
    const col=p.val>=10000?'var(--green2)':'var(--red2)';
    return `<div class="lb-row"><span class="lb-rank">${medals[i]||i+1}</span><span class="lb-name"${p.me?' style="color:var(--accent2)"':''}>${p.name}${p.me?' ◄':''}</span><span class="lb-val" style="color:${col}">${fd(p.val,0)}</span></div>`;
  }).join('');
}

function rLog(){
  const el=document.getElementById('log');
  if(!logs.length){el.innerHTML='<div class="litem" style="color:var(--sub2)">No trades — start trading!</div>';return;}
  el.innerHTML=logs.slice(-10).reverse().map(l=>`<div class="litem">${l}</div>`).join('');
}

function rAll(){rCoins();drawChart();rPort();rBal();rTicker();rLeaders();rLog();rShorts();}

function selC(i){sel=i;document.getElementById('trade-hdr').textContent=`Trading · ${COINS[i].id}`;rAll();}
function sa(n){document.getElementById('amt').value=n<0?Math.floor(cash):n;}

function showToast(msg,ok){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=ok?'var(--green-bg)':'var(--red-bg)';
  t.style.border=`1px solid ${ok?'var(--green-border)':'var(--red-border)'}`;
  t.style.color=ok?'var(--green2)':'var(--red2)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);
  if(tg)tg.HapticFeedback?.notificationOccurred(ok?'success':'error');
}

function setMode(mode){
  tradeMode=mode;
  const tl=document.getElementById('tab-long');
  const ts=document.getElementById('tab-short');
  const tb=document.getElementById('trade-btns');
  if(mode==='long'){
    tl.className='mode-tab long-active';
    ts.className='mode-tab';
    tb.innerHTML='<button class="btn-buy" onclick="trade(\'buy\')">▲ BUY</button><button class="btn-sell" onclick="trade(\'sell\')">▼ SELL</button>';
  } else {
    tl.className='mode-tab';
    ts.className='mode-tab short-active';
    tb.innerHTML='<button class="btn-sell" style="grid-column:1/-1" onclick="trade(\'short\')">▼ OPEN SHORT</button>';
  }
}

function rShorts(){
  let hasShort=false;
  let html='';
  COINS.forEach(c=>{
    const s=shorts[c.id];
    if(!s||!c.p) return;
    hasShort=true;
    const pnl=(s.entryPrice-c.p)*s.size;
    const pnlPct=(pnl/s.collateral*100);
    const col=pnl>=0?'var(--green2)':'var(--red2)';
    html+=`<div style="background:var(--bg3);border-radius:8px;padding:8px;margin-bottom:8px">
      <div class="short-pos-row"><span style="color:#fff;font-weight:700">${c.id} SHORT</span><span style="color:${col};font-weight:700">${pnl>=0?'+':''}${fd(pnl)} (${pnlPct>=0?'+':''}${pnlPct.toFixed(2)}%)</span></div>
      <div class="short-pos-row"><span style="color:var(--sub)">Entry</span><span>${fp(s.entryPrice)}</span></div>
      <div class="short-pos-row"><span style="color:var(--sub)">Current</span><span>${fp(c.p)}</span></div>
      <div class="short-pos-row"><span style="color:var(--sub)">Size</span><span>${fd(s.collateral)}</span></div>
      <button class="btn-close-short" onclick="closeShort('${c.id}')">✕ CLOSE SHORT ${c.id}</button>
    </div>`;
  });
  const el=document.getElementById('short-pos');
  const sl=document.getElementById('short-list');
  el.style.display=hasShort?'block':'none';
  sl.innerHTML=html;
}

function closeShort(id){
  const c=COINS.find(x=>x.id===id);
  const s=shorts[id];
  if(!s||!c.p) return;
  const pnl=(s.entryPrice-c.p)*s.size;
  const returned=s.collateral+pnl;
  if(returned<0){showToast(`${id} liquidated! -${fd(s.collateral)}`,false);}
  else{
    cash+=returned;
    const now=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
    logs.push(`${now} · <span class="sell-tag">CLOSED SHORT</span> <span class="coin-tag">${id}</span> ${pnl>=0?'+':''}${fd(pnl)} @ ${fp(c.p)}`);
    showToast(`Short ${id} closed ${pnl>=0?'+':''}${fd(pnl)}`,pnl>=0);
  }
  shorts[id]=null;
  rAll();
}

function trade(type){
  const c=COINS[sel];
  if(!c.p){showToast('Waiting for Binance prices...',false);return;}
  const amt=parseFloat(document.getElementById('amt').value)||0;
  if(amt<=0){showToast('Enter an amount!',false);return;}
  const now=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});

  if(type==='short'){
    if(amt>cash+0.01){showToast('Not enough USD!',false);return;}
    if(shorts[c.id]){showToast(`Short ${c.id} already open!`,false);return;}
    const size=amt/c.p;
    cash-=amt;
    shorts[c.id]={size,entryPrice:c.p,collateral:amt};
    logs.push(`${now} · <span class="sell-tag">SHORT</span> <span class="coin-tag">${c.id}</span> ${fd(amt)} @ ${fp(c.p)}`);
    showToast(`Short ${c.id} opened for ${fd(amt)}`,true);
  } else if(type==='buy'){
    if(amt>cash+0.01){showToast('Not enough USD!',false);return;}
    const coins=amt/c.p;cash-=amt;hold[c.id]+=coins;
    logs.push(`${now} · <span class="buy-tag">BOUGHT</span> <span class="coin-tag">${c.id}</span> for ${fd(amt)} @ ${fp(c.p)}`);
    showToast(`Bought ${coins.toFixed(coins>1?2:5)} ${c.id}`,true);
  } else {
    const coins=amt/c.p;
    if(coins>hold[c.id]+0.000001){showToast('Not enough coins!',false);return;}
    hold[c.id]-=coins;if(hold[c.id]<0.000001)hold[c.id]=0;cash+=amt;
    logs.push(`${now} · <span class="sell-tag">SOLD</span> <span class="coin-tag">${c.id}</span> for ${fd(amt)} @ ${fp(c.p)}`);
    showToast(`Sold for ${fd(amt)}`,true);
  }
  rAll();
}

fetchPrices();
setInterval(fetchPrices,2000);
</script>
