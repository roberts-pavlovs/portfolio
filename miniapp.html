<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shop Mini App — Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#17212b;
  --bg2:#242f3d;
  --bg3:#1c2733;
  --accent:#5288c1;
  --accent2:#64b5f6;
  --text:#ffffff;
  --sub:#7d9cb8;
  --border:#2a3a4a;
  --green:#4caf50;
  --red:#ef5350;
  --card:#1e2d3d;
}
html,body{height:100%;background:var(--bg);font-family:'Manrope',sans-serif;color:var(--text);overflow-x:hidden;max-width:420px;margin:0 auto}

/* HEADER */
.header{background:var(--bg2);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:10px}
.back{color:var(--accent2);font-size:14px;cursor:pointer;padding:4px}
.header-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
.cart-btn{position:relative;background:var(--accent);border:none;border-radius:10px;padding:7px 14px;color:white;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Manrope',sans-serif}
.cart-count{background:var(--red);color:white;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;position:absolute;top:-6px;right:-6px}

/* SEARCH */
.search-wrap{padding:12px 16px;background:var(--bg)}
.search{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;width:100%;color:var(--text);font-size:14px;font-family:'Manrope',sans-serif;outline:none}
.search::placeholder{color:var(--sub)}

/* CATEGORIES */
.cats{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all 0.2s;color:var(--sub)}
.cat.active{background:var(--accent);border-color:var(--accent);color:white}

/* BANNER */
.banner{margin:0 16px 16px;background:linear-gradient(135deg,#1a3a5c,#0d2135);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.banner::after{content:'🛍️';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:48px;opacity:0.3}
.banner-tag{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.banner-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:4px}
.banner-sub{font-size:13px;color:var(--sub)}

/* SECTION */
.section-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;padding:0 16px 10px;display:flex;justify-content:space-between;align-items:center}
.see-all{font-size:12px;color:var(--accent2);font-weight:500;font-family:'Manrope',sans-serif}

/* PRODUCTS GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all 0.2s;position:relative}
.product-card:active{transform:scale(0.97)}
.product-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:52px;background:var(--bg3);position:relative}
.badge-new{position:absolute;top:8px;left:8px;background:var(--green);color:white;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.badge-sale{position:absolute;top:8px;left:8px;background:var(--red);color:white;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.product-body{padding:10px}
.product-name{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.3}
.product-desc{font-size:11px;color:var(--sub);margin-bottom:8px}
.product-footer{display:flex;justify-content:space-between;align-items:center}
.product-price{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--accent2)}
.product-price-old{font-size:11px;color:var(--sub);text-decoration:line-through;display:block}
.add-btn{background:var(--accent);border:none;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:white;transition:all 0.2s}
.add-btn:active{transform:scale(0.9)}
.add-btn.added{background:var(--green)}

/* HORIZONTAL SCROLL */
.hscroll{display:flex;gap:10px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hcard{background:var(--card);border:1px solid var(--border);border-radius:14px;min-width:140px;overflow:hidden;cursor:pointer;flex-shrink:0}
.hcard-img{height:90px;display:flex;align-items:center;justify-content:center;font-size:38px;background:var(--bg3)}
.hcard-body{padding:8px 10px}
.hcard-name{font-size:12px;font-weight:600;margin-bottom:4px}
.hcard-price{font-size:13px;font-weight:700;color:var(--accent2);font-family:'Syne',sans-serif}

/* CART MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:none;align-items:flex-end}
.overlay.show{display:flex}
.cart-modal{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:20px 16px}
.cart-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.cart-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:16px}
.cart-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-item-icon{font-size:28px;width:44px;height:44px;background:var(--bg3);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cart-item-info{flex:1}
.cart-item-name{font-size:14px;font-weight:600}
.cart-item-price{font-size:13px;color:var(--accent2);font-weight:600}
.cart-item-remove{color:var(--red);font-size:18px;cursor:pointer;padding:4px}
.cart-total{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
.cart-total-label{font-size:15px;color:var(--sub)}
.cart-total-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent2)}
.checkout-btn{width:100%;background:var(--accent);color:white;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;margin-top:4px;transition:all 0.2s}
.checkout-btn:active{transform:scale(0.98)}
.empty-cart{text-align:center;padding:32px 0;color:var(--sub);font-size:14px}
.empty-icon{font-size:40px;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:8px 0 12px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-icon{font-size:20px}
.nav-label{font-size:10px;color:var(--sub)}
.nav-item.active .nav-label{color:var(--accent2)}
.pb{padding-bottom:70px}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="back">← Back</span>
    <span class="header-title">🛍️ TechStore</span>
  </div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Cart
    <span class="cart-count" id="cartCount" style="display:none">0</span>
  </button>
</div>

<div class="search-wrap">
  <input class="search" placeholder="🔍  Search products..." oninput="filterProducts(this.value)">
</div>

<div class="cats">
  <div class="cat active" onclick="filterCat('all',this)">All</div>
  <div class="cat" onclick="filterCat('phones',this)">📱 Phones</div>
  <div class="cat" onclick="filterCat('audio',this)">🎧 Audio</div>
  <div class="cat" onclick="filterCat('watch',this)">⌚ Watches</div>
  <div class="cat" onclick="filterCat('laptop',this)">💻 Laptops</div>
</div>

<div class="banner">
  <div class="banner-tag">Deal of the week</div>
  <div class="banner-title">Up to 30% off</div>
  <div class="banner-sub">All electronics until month end</div>
</div>

<div class="section-title">Popular <span class="see-all">See all</span></div>
<div class="hscroll">
  <div class="hcard" onclick="addToCart('AirPods Pro','🎧',12900)">
    <div class="hcard-img">🎧</div>
    <div class="hcard-body">
      <div class="hcard-name">AirPods Pro</div>
      <div class="hcard-price">€129</div>
    </div>
  </div>
  <div class="hcard" onclick="addToCart('Apple Watch','⌚',24900)">
    <div class="hcard-img">⌚</div>
    <div class="hcard-body">
      <div class="hcard-name">Apple Watch</div>
      <div class="hcard-price">€249</div>
    </div>
  </div>
  <div class="hcard" onclick="addToCart('iPad Mini','📱',39900)">
    <div class="hcard-img">📱</div>
    <div class="hcard-body">
      <div class="hcard-name">iPad Mini</div>
      <div class="hcard-price">€399</div>
    </div>
  </div>
  <div class="hcard" onclick="addToCart('MacBook Air','💻',89900)">
    <div class="hcard-img">💻</div>
    <div class="hcard-body">
      <div class="hcard-name">MacBook Air</div>
      <div class="hcard-price">€899</div>
    </div>
  </div>
</div>

<div class="section-title">Catalog <span class="see-all">Filters</span></div>
<div class="grid pb" id="productGrid"></div>

<!-- CART -->
<div class="overlay" id="overlay" onclick="closeCart(event)">
  <div class="cart-modal" id="cartModal">
    <div class="cart-handle"></div>
    <div class="cart-title">Your cart</div>
    <div id="cartItems"></div>
    <div class="cart-total">
      <span class="cart-total-label">Total:</span>
      <span class="cart-total-val" id="cartTotal">€0</span>
    </div>
    <button class="checkout-btn" onclick="checkout()">Checkout →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="bottom-nav">
  <div class="nav-item active"><div class="nav-icon">🏠</div><div class="nav-label">Home</div></div>
  <div class="nav-item"><div class="nav-icon">🔍</div><div class="nav-label">Search</div></div>
  <div class="nav-item" onclick="toggleCart()"><div class="nav-icon">🛒</div><div class="nav-label">Cart</div></div>
  <div class="nav-item"><div class="nav-icon">❤️</div><div class="nav-label">Favorites</div></div>
  <div class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">Profile</div></div>
</div>

<script>
const products = [
  {id:1,name:'iPhone 15 Pro',desc:'256GB, Titanium',price:1199,oldPrice:1329,icon:'📱',cat:'phones',badge:'sale'},
  {id:2,name:'Samsung Galaxy S24',desc:'128GB, Phantom Black',price:849,icon:'📱',cat:'phones',badge:'new'},
  {id:3,name:'Sony WH-1000XM5',desc:'Noise cancelling',price:279,oldPrice:349,icon:'🎧',cat:'audio',badge:'sale'},
  {id:4,name:'JBL Flip 6',desc:'Bluetooth speaker',price:109,icon:'🔊',cat:'audio',badge:'new'},
  {id:5,name:'Garmin Fenix 7',desc:'GPS smartwatch',price:649,icon:'⌚',cat:'watch',badge:''},
  {id:6,name:'Samsung Galaxy Watch 6',desc:'44mm, Black',price:249,oldPrice:299,icon:'⌚',cat:'watch',badge:'sale'},
  {id:7,name:'ASUS ROG Zephyrus',desc:'RTX 4070, 16GB',price:1899,icon:'💻',cat:'laptop',badge:'new'},
  {id:8,name:'Lenovo ThinkPad X1',desc:'i7, 32GB RAM',price:1499,icon:'💻',cat:'laptop',badge:''},
];

let cart = [];
let currentCat = 'all';
let searchQ = '';

function renderProducts(){
  const grid = document.getElementById('productGrid');
  let filtered = products.filter(p => {
    const matchCat = currentCat === 'all' || p.cat === currentCat;
    const matchSearch = p.name.toLowerCase().includes(searchQ.toLowerCase());
    return matchCat && matchSearch;
  });
  grid.innerHTML = filtered.map(p => `
    <div class="product-card" onclick="addToCart('${p.name}','${p.icon}',${p.price})">
      <div class="product-img">
        ${p.icon}
        ${p.badge === 'new' ? '<div class="badge-new">NEW</div>' : ''}
        ${p.badge === 'sale' ? '<div class="badge-sale">SALE</div>' : ''}
      </div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.desc}</div>
        <div class="product-footer">
          <div>
            ${p.oldPrice ? `<span class="product-price-old">€${p.oldPrice.toLocaleString()}</span>` : ''}
            <span class="product-price">€${p.price.toLocaleString()}</span>
          </div>
          <button class="add-btn" onclick="event.stopPropagation();addToCart('${p.name}','${p.icon}',${p.price})">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

function filterCat(cat, el){
  currentCat = cat;
  document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderProducts();
}

function filterProducts(q){
  searchQ = q;
  renderProducts();
}

function addToCart(name, icon, price){
  const existing = cart.find(i => i.name === name);
  if(existing){ existing.qty++; }
  else { cart.push({name, icon, price, qty:1}); }
  updateCartCount();
  showToast('✓ ' + name + ' added');
}

function updateCartCount(){
  const total = cart.reduce((s,i) => s + i.qty, 0);
  const el = document.getElementById('cartCount');
  el.textContent = total;
  el.style.display = total > 0 ? 'flex' : 'none';
}

function toggleCart(){
  const overlay = document.getElementById('overlay');
  overlay.classList.toggle('show');
  if(overlay.classList.contains('show')) renderCart();
}

function closeCart(e){
  if(e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('show');
}

function renderCart(){
  const el = document.getElementById('cartItems');
  const totalEl = document.getElementById('cartTotal');
  if(cart.length === 0){
    el.innerHTML = '<div class="empty-cart"><div class="empty-icon">🛒</div>Cart is empty</div>';
    totalEl.textContent = '€0';
    return;
  }
  el.innerHTML = cart.map((item,i) => `
    <div class="cart-item">
      <div class="cart-item-icon">${item.icon}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name} ${item.qty > 1 ? '×'+item.qty : ''}</div>
        <div class="cart-item-price">€${(item.price * item.qty).toLocaleString()}</div>
      </div>
      <span class="cart-item-remove" onclick="removeItem(${i})">✕</span>
    </div>
  `).join('');
  const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
  totalEl.textContent = '€' + total.toLocaleString();
}

function removeItem(i){
  cart.splice(i,1);
  updateCartCount();
  renderCart();
}

function checkout(){
  cart = [];
  updateCartCount();
  document.getElementById('overlay').classList.remove('show');
  showToast('✓ Order placed! Stand by');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

renderProducts();
</script>
</body>
</html>
