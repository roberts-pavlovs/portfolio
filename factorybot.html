<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Line Logger — Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --tg-bg:     #0e1621;
    --tg-bg2:    #17212b;
    --tg-bot:    #182533;
    --tg-user:   #2b5278;
    --tg-text:   #ffffff;
    --tg-sub:    #708499;
    --tg-accent: #5288c1;
    --tg-green:  #4dcd5e;
    --tg-yellow: #ffd166;
    --tg-red:    #e54848;
    --tg-border: #1a2735;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-bg);
    color: var(--tg-text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
  }

  /* Header */
  .header {
    background: var(--tg-bg2);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--tg-border);
    flex-shrink: 0;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a6e3a, #1f4d1f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .chat-name { font-size: 15px; font-weight: 600; }
  .chat-sub  { font-size: 12px; color: var(--tg-sub); margin-top: 1px; }

  /* Messages */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px 8px;
    background: var(--tg-bg);
    background-image: radial-gradient(circle at 20% 30%, rgba(82,136,193,0.04) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .msg {
    max-width: 88%;
    padding: 8px 12px;
    border-radius: 12px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: appear .25s ease;
    font-size: 14px;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.bot {
    background: var(--tg-bot);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--tg-user);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg .time {
    font-size: 11px;
    color: var(--tg-sub);
    margin-top: 4px;
    text-align: right;
  }
  .msg b { font-weight: 700; }
  .msg i { color: var(--tg-sub); font-style: normal; font-size: 12px; }

  /* Keyboard */
  .keyboard {
    background: var(--tg-bg2);
    padding: 6px 6px 8px;
    display: grid;
    gap: 5px;
    grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--tg-border);
    flex-shrink: 0;
  }
  .keyboard.cols-1 { grid-template-columns: 1fr; }
  .key-btn {
    background: #2c3e50;
    color: var(--tg-text);
    border: none;
    padding: 11px 8px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
    font-family: inherit;
  }
  .key-btn:active { background: #34495e; }
  .key-btn.full { grid-column: 1 / -1; }
  .key-btn.cancel { background: #2a2f38; color: var(--tg-sub); }
  .key-btn.green  { background: #2d7d3a; }
  .key-btn.green:active  { background: #38994a; }

  /* Banner */
  .banner {
    background: rgba(82,136,193,0.12);
    border-top: 1px solid var(--tg-border);
    padding: 8px 14px;
    font-size: 12px;
    color: var(--tg-sub);
    text-align: center;
    flex-shrink: 0;
  }
  .banner b { color: var(--tg-accent); }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">🏭</div>
  <div>
    <div class="chat-name">Line Logger</div>
    <div class="chat-sub" id="chatSub">bot</div>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="keyboard" id="kb"></div>

<div class="banner">This is a <b>demo</b> — bot runs on a real factory line</div>

<script>
// ──────────────────────────────────────────────
// Demo data: a week of real production
// ──────────────────────────────────────────────
const TODAY = "15.05.2026";
const NOW = "14:23";

const demoData = {
  "15.05.2026": {
    start: "08:05", start_delay: 5, start_note: "Compressors took long to warm up",
    stops: [
      { type:"lunch", from:"12:00", to:"12:35", mins:35, reason:"" },
      { type:"paint", from:"13:40", to:"13:52", mins:12, reason:"Black to white" },
    ],
    end: null
  },
  "14.05.2026": {
    start: "08:00", start_delay: 0,
    stops: [
      { type:"lunch", from:"12:00", to:"12:28", mins:28, reason:"" },
      { type:"tech", from:"15:20", to:"15:55", mins:35, reason:"Clogged nozzle" },
    ],
    end: "20:00"
  },
  "13.05.2026": {
    start: "08:00", start_delay: 0,
    stops: [{ type:"lunch", from:"12:05", to:"12:30", mins:25, reason:"" }],
    end: "20:00"
  },
  "12.05.2026": {
    start: "08:12", start_delay: 12, start_note: "Electrician arrived late",
    stops: [
      { type:"lunch", from:"12:00", to:"12:45", mins:45, reason:"Discussed new order" },
      { type:"paint", from:"16:10", to:"16:20", mins:10, reason:"" },
    ],
    end: "20:00"
  },
  "11.05.2026": {
    start: "08:00", start_delay: 0,
    stops: [
      { type:"lunch", from:"12:00", to:"12:30", mins:30, reason:"" },
      { type:"tech", from:"10:30", to:"11:25", mins:55, reason:"Conveyor broke, repaired" },
    ],
    end: "20:00"
  },
};

// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
let state = "idle";
let stopCtx = {};

// ──────────────────────────────────────────────
// Helpers
// ──────────────────────────────────────────────
function fmtMins(m) {
  m = Math.max(0, parseInt(m));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h} h ${r} min` : `${h} h`;
}

function stopDowntime(s) {
  return s.type === "lunch" ? Math.max(0, s.mins - 30) : s.mins;
}

function totalDowntime(day) {
  let d = (day.stops || []).reduce((a, s) => a + stopDowntime(s), 0);
  return d + (day.start_delay || 0);
}

function efficiency(down) {
  return Math.max(0, Math.round(((720 - down) / 720) * 100));
}

function typeIcon(t) {
  return { lunch:"🍽", tech:"🔧", paint:"🎨", other:"📝", end:"🔚" }[t] || "⏸";
}
function typeLabel(t) {
  return { lunch:"Lunch", tech:"Breakdown", paint:"Paint change", other:"Other", end:"End of shift" }[t] || t;
}

// ──────────────────────────────────────────────
// Messages
// ──────────────────────────────────────────────
function addMsg(text, who="bot") {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + who;
  const time = new Date().toLocaleTimeString("en-US", { hour:"2-digit", minute:"2-digit", hour12:false });
  div.innerHTML = text.replace(/\*(.+?)\*/g, "<b>$1</b>") + `<div class="time">${time}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setKeyboard(buttons, cols=2) {
  const kb = document.getElementById("kb");
  kb.innerHTML = "";
  kb.className = "keyboard" + (cols === 1 ? " cols-1" : "");
  buttons.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "key-btn" + (b.cls ? " " + b.cls : "");
    btn.textContent = b.text;
    btn.onclick = () => handle(b.text);
    if (b.full) btn.classList.add("full");
    kb.appendChild(btn);
  });
}

// ──────────────────────────────────────────────
// Main menu
// ──────────────────────────────────────────────
function mainMenu() {
  state = "idle";
  setKeyboard([
    { text:"📅 Today" },             { text:"📆 Pick date" },
    { text:"📊 This week" },         { text:"📈 This month" },
    { text:"▶️ Start line", cls:"green" }, { text:"⏸ Stop line" },
  ]);
}

// ──────────────────────────────────────────────
// Report formatting
// ──────────────────────────────────────────────
function formatDay(dateKey, day) {
  let s = `📅 *${dateKey}*\n\n`;
  if (day.start) {
    const icon = day.start_delay === 0 ? "✅" : "⚠️";
    s += `▶️ *Line started — ${day.start}*\n`;
    if (day.start_note) s += `   📝 ${day.start_note}\n`;
    s += day.start_delay > 0
      ? `   ${icon} Delay: +${fmtMins(day.start_delay)}\n`
      : `   ${icon} On time\n`;
  } else {
    s += `▶️ Start not logged\n`;
  }
  s += "\n";
  for (const st of (day.stops || [])) {
    const real = stopDowntime(st);
    s += `${typeIcon(st.type)} *${typeLabel(st.type)}* — ${st.from} → ${st.to}\n`;
    if (st.reason) s += `   📝 ${st.reason}\n`;
    if (st.type === "lunch") {
      s += `   🕐 Duration: ${fmtMins(st.mins)}\n`;
      s += real > 0
        ? `   🔴 Downtime: ${fmtMins(real)} (over limit)\n`
        : `   🟢 Within limit (≤30 min)\n`;
    } else {
      s += `   ⏱ Downtime: ${fmtMins(st.mins)}\n`;
    }
  }
  if (day.end) {
    s += `\n🔚 *End of shift — ${day.end}*\n`;
  }
  const down = totalDowntime(day);
  s += `\n─────────────────\n`;
  s += `⏱ Total downtime: *${fmtMins(down)}*\n`;
  s += `📊 Efficiency: *${efficiency(down)}%*\n`;
  s += `_(12h shift · 30 min lunch not counted)_`;
  return s;
}

function formatWeek() {
  let s = "📊 *Weekly statistics*\n\n";
  let totalDown = 0, totalDelay = 0, totalStops = 0, workDays = 0;
  const dates = Object.keys(demoData).sort((a,b) => {
    const [da,ma,ya] = a.split(".").map(Number);
    const [db,mb,yb] = b.split(".").map(Number);
    return new Date(ya,ma-1,da) - new Date(yb,mb-1,db);
  });
  for (const d of dates) {
    const day = demoData[d];
    const down = totalDowntime(day);
    totalDown += down;
    totalDelay += day.start_delay || 0;
    totalStops += (day.stops || []).length;
    workDays++;
    const eff = efficiency(down);
    const flag = eff >= 95 ? "🟢" : eff >= 88 ? "🟡" : "🔴";
    s += `${flag} *${d}* — ${fmtMins(down)} downtime, ${eff}%\n`;
    const delayStr = day.start_delay > 0 ? ` (+${fmtMins(day.start_delay)})` : "";
    s += `   Start ${day.start}${delayStr} · ${(day.stops||[]).length} stops\n`;
  }
  const avg = Math.round(totalDown / Math.max(workDays, 1));
  s += `\n─────────────────\n`;
  s += `⏱ Total downtime: *${fmtMins(totalDown)}*\n`;
  s += `📉 Daily average: *${fmtMins(avg)}*\n`;
  s += `⏰ Late starts: *${fmtMins(totalDelay)}*\n`;
  s += `🛑 Stops: *${totalStops}*`;
  return s;
}

function formatMonth() {
  let totalDown = 0, workDays = 0;
  const byType = { lunch:0, tech:0, paint:0, other:0 };
  for (const d in demoData) {
    workDays++;
    totalDown += totalDowntime(demoData[d]);
    for (const st of demoData[d].stops || []) {
      if (st.type in byType) byType[st.type] += stopDowntime(st);
    }
  }
  const eff = efficiency(Math.round(totalDown / Math.max(workDays,1)));
  let s = "📈 *Monthly statistics*\n\n";
  s += `📅 Work days: ${workDays}\n`;
  s += `⏱ Total downtime: *${fmtMins(totalDown)}*\n`;
  s += `📊 Average efficiency: *${eff}%*\n\n`;
  s += `*By reason:*\n`;
  s += `🍽 Lunch (over limit): ${fmtMins(byType.lunch)}\n`;
  s += `🔧 Breakdowns: ${fmtMins(byType.tech)}\n`;
  s += `🎨 Paint changes: ${fmtMins(byType.paint)}\n`;
  s += `📝 Other: ${fmtMins(byType.other)}\n\n`;
  s += `_Demo: 5 days of data. On the real factory, the bot tracks any period._`;
  return s;
}

// ──────────────────────────────────────────────
// Button handling
// ──────────────────────────────────────────────
function handle(btn) {
  if (btn === "❌ Cancel") {
    addMsg(btn, "user");
    addMsg("Cancelled.");
    mainMenu();
    return;
  }
  addMsg(btn, "user");

  // Main menu
  if (state === "idle") {
    if (btn === "📅 Today") {
      addMsg(formatDay(TODAY, demoData[TODAY]));
      return;
    }
    if (btn === "📊 This week") {
      addMsg(formatWeek());
      return;
    }
    if (btn === "📈 This month") {
      addMsg(formatMonth());
      return;
    }
    if (btn === "📆 Pick date") {
      addMsg(`Enter date in format *DD.MM.YYYY*\n_Demo dates available: 11.05.2026 — 15.05.2026_`);
      setKeyboard([
        { text:"11.05.2026" }, { text:"12.05.2026" },
        { text:"13.05.2026" }, { text:"14.05.2026" },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ]);
      state = "pick_date";
      return;
    }
    if (btn === "▶️ Start line") {
      addMsg(`▶️ *Line start*\nTime: *${NOW}*\n\nWas the line started on time or delayed?`);
      setKeyboard([
        { text:"✅ On time, all good", cls:"green", full:true },
        { text:"⚠️ Was delayed", full:true },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ], 1);
      state = "start_ontime";
      return;
    }
    if (btn === "⏸ Stop line") {
      addMsg(`⏸ *Line stop*\nTime: *${NOW}*\n\nSelect reason:`);
      setKeyboard([
        { text:"🍽 Lunch" },          { text:"🔧 Breakdown" },
        { text:"🎨 Paint change" },   { text:"📝 Other" },
        { text:"🔚 End of shift", full:true },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ]);
      state = "stop_choose";
      return;
    }
  }

  // Date pick
  if (state === "pick_date") {
    if (demoData[btn]) {
      addMsg(formatDay(btn, demoData[btn]));
    } else {
      addMsg(`📅 *${btn}*\n\n📭 No data for this day.`);
    }
    mainMenu();
    return;
  }

  // Start
  if (state === "start_ontime") {
    if (btn === "✅ On time, all good") {
      addMsg(`✅ *Line started!*\n▶️ Start: ${NOW}\n🟢 On time · Saved 💾`);
      mainMenu();
    } else if (btn === "⚠️ Was delayed") {
      addMsg(`⚠️ Enter reason for delay.\n_In demo pick a ready one:_`);
      setKeyboard([
        { text:"Compressor took long to warm up", full:true },
        { text:"Electrician was late", full:true },
        { text:"Wrong paint delivered", full:true },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ], 1);
      state = "start_reason";
    }
    return;
  }
  if (state === "start_reason") {
    addMsg(`✅ *Line started!*\n▶️ Start: ${NOW}\n⚠️ Delay: +23 min\n📝 ${btn}\n💾 Saved`);
    mainMenu();
    return;
  }

  // Stop
  if (state === "stop_choose") {
    if (btn === "🍽 Lunch") {
      addMsg(`🍽 *Lunch started — ${NOW}*\nLimit: 30 minutes\n\nTap when crew is back:`);
      setKeyboard([
        { text:"▶️ Start line (back in 28 min)", cls:"green", full:true },
        { text:"▶️ Start line (overran to 42 min)", full:true },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ], 1);
      state = "lunch_active";
      return;
    }
    if (btn === "🔧 Breakdown") {
      addMsg(`🔧 *Breakdown*\n\nDescribe what happened.\n_In demo pick one:_`);
      setKeyboard([
        { text:"Clogged nozzle", full:true },
        { text:"Conveyor jammed", full:true },
        { text:"Compressor shut down", full:true },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ], 1);
      state = "tech_reason";
      return;
    }
    if (btn === "🎨 Paint change") {
      addMsg(`🎨 *Paint change*\n\nAdd a comment (optional):`);
      setKeyboard([
        { text:"Black to white", full:true },
        { text:"⏭ Skip", full:true },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ], 1);
      state = "paint_reason";
      return;
    }
    if (btn === "📝 Other") {
      addMsg(`📝 *Other*\n\nDescribe reason (optional):`);
      setKeyboard([
        { text:"Team smoke break", full:true },
        { text:"Material delivery", full:true },
        { text:"⏭ Skip", full:true },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ], 1);
      state = "other_reason";
      return;
    }
    if (btn === "🔚 End of shift") {
      addMsg(`🔚 *End of shift*\nTime: *${NOW}*\n\nAny comment?`);
      setKeyboard([
        { text:"⏭ Skip", full:true },
        { text:"Shift went smoothly", full:true },
        { text:"❌ Cancel", cls:"cancel", full:true },
      ], 1);
      state = "end_note";
      return;
    }
  }

  if (state === "lunch_active") {
    if (btn.includes("28 min")) {
      addMsg(`✅ *Line started!*\n\n🍽 Lunch: 12:00 → 12:28\n⏱ 28 min\n🟢 Within limit · 💾 Saved`);
      mainMenu();
    } else {
      addMsg(`⚠️ *Lunch 42 min* — over limit by 12 min\n\nWhy did lunch overrun?`);
      setKeyboard([
        { text:"Discussed new order", full:true },
        { text:"Food delivery was late", full:true },
        { text:"⏭ Skip", full:true },
      ], 1);
      state = "lunch_overrun";
    }
    return;
  }
  if (state === "lunch_overrun") {
    const reason = btn === "⏭ Skip" ? "" : btn;
    addMsg(`✅ *Line started!*\n\n🍽 Lunch: 12:00 → 12:42 (42 min)\n🔴 Downtime: 12 min (over limit)\n${reason ? "📝 " + reason + "\n" : ""}💾 Saved`);
    mainMenu();
    return;
  }

  if (state === "tech_reason") {
    addMsg(`🔧 *Breakdown logged*\nStart: ${NOW}\n📝 ${btn}\n\nTap when line is back up:`);
    setKeyboard([
      { text:"▶️ Start line (after 35 min)", cls:"green", full:true },
      { text:"❌ Cancel", cls:"cancel", full:true },
    ], 1);
    stopCtx = { type:"tech", reason: btn };
    state = "stop_active";
    return;
  }
  if (state === "paint_reason") {
    const reason = btn === "⏭ Skip" ? "" : btn;
    addMsg(`🎨 *Paint change logged*\nStart: ${NOW}\n${reason ? "📝 " + reason + "\n" : ""}\nTap when line is back up:`);
    setKeyboard([
      { text:"▶️ Start line (after 12 min)", cls:"green", full:true },
      { text:"❌ Cancel", cls:"cancel", full:true },
    ], 1);
    stopCtx = { type:"paint", reason };
    state = "stop_active";
    return;
  }
  if (state === "other_reason") {
    const reason = btn === "⏭ Skip" ? "" : btn;
    addMsg(`📝 *Other logged*\nStart: ${NOW}\n${reason ? "📝 " + reason + "\n" : ""}\nTap when line is back up:`);
    setKeyboard([
      { text:"▶️ Start line (after 18 min)", cls:"green", full:true },
      { text:"❌ Cancel", cls:"cancel", full:true },
    ], 1);
    stopCtx = { type:"other", reason };
    state = "stop_active";
    return;
  }
  if (state === "stop_active") {
    const t = stopCtx.type;
    const mins = t === "tech" ? 35 : t === "paint" ? 12 : 18;
    addMsg(`✅ *Line started!*\n\n${typeIcon(t)} ${typeLabel(t)}: ${NOW} → 14:${(parseInt(NOW.split(":")[1]) + mins) % 60 || "00"}\n⏱ ${fmtMins(mins)}\n${stopCtx.reason ? "📝 " + stopCtx.reason + "\n" : ""}💾 Saved`);
    mainMenu();
    return;
  }

  if (state === "end_note") {
    const note = btn === "⏭ Skip" ? "" : btn;
    addMsg(`🔚 *Shift finished!*\nTime: ${NOW}\n${note ? "📝 " + note + "\n" : ""}💾 Saved`);
    mainMenu();
    return;
  }
}

// ──────────────────────────────────────────────
// Start
// ──────────────────────────────────────────────
addMsg("🏭 *Paint line logger*\n\nI log line starts, stops, and calculate downtime minutes.\nPick an action:");
mainMenu();
</script>

</body>
</html>
